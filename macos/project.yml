name: SnapBrief
options:
  bundleIdPrefix: live.yesworkflow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  SnapBriefCore:
    path: .
targets:
  SnapBrief:
    type: application
    platform: macOS
    sources:
      - path: Sources/SnapBriefMac
      - path: Resources/SnapBrief.icns
        optional: true
    dependencies:
      - package: SnapBriefCore
        product: SnapBriefCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: SnapBrief
        CFBundleDisplayName: SnapBrief
        CFBundleIdentifier: live.yesworkflow.snapbrief
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Nikita Efimov"
        NSAppleEventsUsageDescription: "SnapBrief вставляет подготовленный пакет в приложение-получатель."
        CFBundleIconFile: SnapBrief
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yesworkflow.snapbrief
        PRODUCT_MODULE_NAME: SnapBriefMac
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  SnapBriefTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SnapBriefMacTests
    dependencies:
      - target: SnapBrief
      - package: SnapBriefCore
        product: SnapBriefCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: live.yesworkflow.snapbrief.tests
schemes:
  SnapBrief:
    build:
      targets:
        SnapBrief: all
        SnapBriefTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapBriefTests
