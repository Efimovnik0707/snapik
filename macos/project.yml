name: Snapik
options:
  bundleIdPrefix: live.yesworkflow
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  SnapikCore:
    path: .
targets:
  Snapik:
    type: application
    platform: macOS
    sources:
      - path: Sources/SnapikMac
        excludes:
          - "Resources/**/*.md"
      - path: Resources/Snapik.icns
        optional: true
    dependencies:
      - package: SnapikCore
        product: SnapikCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Snapik
        CFBundleDisplayName: Snapik
        CFBundleIdentifier: live.yesworkflow.snapik
        CFBundleShortVersionString: "1.5.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Nikita Efimov"
        NSAppleEventsUsageDescription: "Snapik вставляет подготовленный пакет в приложение-получатель."
        CFBundleIconFile: Snapik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yesworkflow.snapik
        PRODUCT_MODULE_NAME: SnapikMac
        SWIFT_VERSION: "5"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  SnapikTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SnapikMacTests
    dependencies:
      - target: Snapik
      - package: SnapikCore
        product: SnapikCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_BUNDLE_IDENTIFIER: live.yesworkflow.snapik.tests
schemes:
  Snapik:
    build:
      targets:
        Snapik: all
        SnapikTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapikTests
