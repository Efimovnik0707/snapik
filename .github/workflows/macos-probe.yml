name: macos-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode
          which xcodegen || echo "no xcodegen"
          brew --version | head -1
          sysctl -n machdep.cpu.brand_string
          uname -m
